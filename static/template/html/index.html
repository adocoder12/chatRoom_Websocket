<!doctype html>
<html>
  <head>
    <title>Go Chat</title>
    <style>
      #messages {
        height: 300px;
        overflow-y: scroll;
        border: 1px solid #ccc;
        padding: 10px;
      }
      .system {
        color: #888;
        font-style: italic;
      }
    </style>
  </head>
  <body>
    <h1>Go Chat with Rooms</h1>
    <div>
      <input type="text" id="username" placeholder="Username" />
      <button onclick="connect()">Connect</button>
    </div>
    <div>
      <input type="text" id="room" placeholder="Room name" />
      <button onclick="joinRoom()">Join Room</button>
    </div>
    <div id="messages"></div>
    <div>
      <input
        type="text"
        id="message"
        placeholder="Message"
        onkeypress="if (event.key === 'Enter') sendMessage();"
      />
      <button onclick="sendMessage()">Send</button>
    </div>

    <script>
      let ws;

      function connect() {
        const username =
          document.getElementById("username").value || "anonymous";
        // location.host = same host:port that served this page (matches gorilla's same-origin check)
        ws = new WebSocket(
          `ws://${location.host}/api/v1/ws?username=${encodeURIComponent(username)}`,
        );

        ws.onmessage = function (event) {
          const msg = JSON.parse(event.data);
          const div = document.createElement("div");
          if (msg.type !== "message") {
            // join / leave / system: grey italic text from the server
            div.className = "system";
            div.textContent = msg.content;
          } else {
            div.textContent = `${msg.username}: ${msg.content}`;
          }
          document.getElementById("messages").appendChild(div);
        };

        ws.onclose = function () {
          const div = document.createElement("div");
          div.className = "system";
          div.textContent = "Disconnected.";
          document.getElementById("messages").appendChild(div);
        };
      }

      // Sending before Connect (or after the server closed) would throw.
      function isOpen() {
        return ws && ws.readyState === WebSocket.OPEN;
      }

      function joinRoom() {
        if (!isOpen()) return alert("Connect first.");
        const room = document.getElementById("room").value;
        ws.send(JSON.stringify({ type: "join", room: room }));
      }

      function sendMessage() {
        if (!isOpen()) return alert("Connect first.");
        const content = document.getElementById("message").value;
        ws.send(JSON.stringify({ type: "message", content: content }));
        document.getElementById("message").value = "";
      }
    </script>
  </body>
</html>
